# Answer a note the moment it lands, instead of waiting for the twice-daily
# Routine. The board's relay commits into claude-inbox/, that push runs this,
# and Claude's reply is committed back as a patch the board folds in on its
# next load. Typical end to end: under a minute.
#
# Needs one repository secret, CLAUDE_CODE_OAUTH_TOKEN, generated on the Mac
# with `claude setup-token`. Without it the job fails on the first run and
# nothing else breaks: the Routine still picks the notes up on its schedule.
#
# This runs the Claude Code CLI rather than anthropics/claude-code-action,
# which rejects this trigger outright: "Unsupported event type: push". The
# action is built for issue and pull request events. The CLI takes the same
# subscription token in CLAUDE_CODE_OAUTH_TOKEN and has no such restriction.
name: Answer notes

on:
  # The relay asks for a run the moment a note lands in its log. This is the
  # normal route now: chat does not pass through git at all.
  repository_dispatch:
    types: [notes]
  # And the old route, kept working on purpose. A board that has not picked up
  # the new version still commits its notes into claude-inbox/, and that must
  # still reach Claude rather than waiting for the twice-daily Routine.
  push:
    branches: [main]
    paths: ["claude-inbox/**"]

# A burst of notes is one conversation, not three. Let a run finish and start
# at most one more behind it, so two sessions never write patches over
# each other.
concurrency:
  group: answer-notes
  cancel-in-progress: false

jobs:
  answer:
    # Claude's own patch commits land in the same folder, so without this the
    # reply would wake another run, which would reply to itself. The commit
    # message is the marker; `[skip ci]` alone is not enough, because it is
    # easy to forget and the loop it allows is not cheap.
    # A dispatch carries no head commit, so these read as false and it runs.
    # On a push they stop the job answering itself: Claude's own reply commits
    # start "Claude:", and the relay's once-a-day archive starts "Relay
    # snapshot" and holds nothing the board has not already seen.
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'Claude:') &&
      !startsWith(github.event.head_commit.message, 'Relay snapshot')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Answer the notes
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # With these set the skill reads the conversation from the relay and
          # posts the reply back to it, so the board hears it on its open
          # socket in the same second. Without them it falls back to reading
          # and committing files, which is what shipped before.
          RELAY_URL: https://mba-cc-relay.thomasgavin777.workers.dev
          RELAY_AGENT_KEY: ${{ secrets.RELAY_AGENT_KEY }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # the commit is Claude's, and its author is what the loop guard above
          # reads, so it is set here rather than left to the runner's default
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          claude -p "/answer-notes" \
            --dangerously-skip-permissions \
            --max-turns 30
