# The relay used to be pasted into the Cloudflare dashboard by hand, which was
# fine while it was 130 lines of one shape. It now holds a Durable Object, and a
# Durable Object namespace is created by a deploy rather than by a dashboard
# field, so the deploy belongs here where it is repeatable and reviewable.
name: Deploy relay

on:
  push:
    branches: [main]
    paths: ["relay/**"]
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Until the token is added this does nothing, on purpose: a red run on
          # main would read as a broken deploy when the truth is that the relay
          # has not been handed over from the dashboard yet.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "No CLOUDFLARE_API_TOKEN yet, so nothing to deploy."
            echo "See relay/README.md for the two secrets this needs."
            exit 0
          fi
          npx --yes wrangler@4 deploy

      # The Worker's own secrets live here too, not only in the dashboard.
      # GH_TOKEN was added by hand and then came back 401 "Bad credentials"
      # after the first deploy from CI, which cost an evening to find because a
      # relay that cannot reach GitHub looks identical to one that can. Pushing
      # them on every deploy makes the Worker reproducible from this repository
      # and means a deploy can never leave it half configured again.
      # Each is skipped when its repository secret is empty, so this never
      # clears a value that only exists on the Worker.
      - name: Sync the Worker's secrets
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.RELAY_GH_TOKEN }}
          AGENT_KEY: ${{ secrets.RELAY_AGENT_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then exit 0; fi
          for name in GH_TOKEN AGENT_KEY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "No repository secret for $name, leaving the Worker's copy alone."
              continue
            fi
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name"
            echo "$name pushed."
          done
